<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lined Script</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#12171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lined Script">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
body { margin: 0; }

/* Layout: one phone column. Sticky take bar on top, thumb-height tabs at the bottom, sheets slide up for notes.
   Look: a continuity sheet. Cool paper greys, a stage-board blue for actions, and green / amber / red that
   always travel with a shape (tick, tilde, cross) so status never depends on colour alone. */
:root {
  --bg: #e7eaee;
  --surface: #ffffff;
  --raised: #f1f3f6;
  --ink: #12171c;
  --muted: #56626e;
  --line: #c8cfd6;
  --accent: #2a52c9;
  --accent-ink: #ffffff;
  --ok: #17803f;   --ok-bg: #ddf1e4;
  --chg: #9c5f00;  --chg-bg: #faeccb;
  --drop: #bf2c22; --drop-bg: #fadcd9;
  --hl: #dfe7fb;
  --ui: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --script: 'Courier Prime', 'Courier New', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1013; --surface: #171b20; --raised: #1f242a; --ink: #e8ecf0; --muted: #97a3af; --line: #2c343c;
    --accent: #8aa9ff; --accent-ink: #0b1430;
    --ok: #4cc27a; --ok-bg: #15301f; --chg: #e8b34a; --chg-bg: #3a2d10; --drop: #ff7a6e; --drop-bg: #3d1b18;
    --hl: #1e2a48; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1013; --surface: #171b20; --raised: #1f242a; --ink: #e8ecf0; --muted: #97a3af; --line: #2c343c;
  --accent: #8aa9ff; --accent-ink: #0b1430;
  --ok: #4cc27a; --ok-bg: #15301f; --chg: #e8b34a; --chg-bg: #3a2d10; --drop: #ff7a6e; --drop-bg: #3d1b18;
  --hl: #1e2a48; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 18px; letter-spacing: .01em;
  padding-block: 10px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
body.noscroll { overflow: hidden; }
.lockbar { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.lockbar b { letter-spacing: .04em; text-transform: uppercase; }
/* projects */
.projbar { margin: 0 0 8px; }
.projbar button { width: 100%; min-height: 40px; display: flex; align-items: center; gap: 8px; text-align: left; padding: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; font-size: 16px; }
.projbar span { color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: 13px; flex: none; }
.projbar b { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
.projbar svg { flex: none; }
.pj { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
.pj.cur { border-color: var(--accent); border-width: 2px; }
.pj .pn { font-size: 22px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; overflow-wrap: anywhere; }
.pj .pm { color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.flagsum.warn { border: 2px solid var(--chg); color: var(--chg); }
/* sync flags + camera */
.flagrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px; }
.flagrow .btn { min-height: 56px; padding: 0 6px; font-size: 16px; line-height: 1.1; }
.wrapbtn { width: 100%; margin-bottom: 8px; }
.daylog { margin: 0 0 12px; font-size: 14px; }
.daylog .dl { padding: 6px 0; border-bottom: 1px solid var(--line); }
.setrow { display: grid; grid-template-columns: 1.2fr 1.1fr 1fr; gap: 6px; margin-top: 8px; }
.setrow .btn { min-height: 56px; font-size: 15px; padding-left: 4px; padding-right: 4px; }
body.locked .setrow .btn { opacity: .45; }
.fixed { display: block; font-size: 22px; font-weight: 700; padding: 6px 0; }
.setrow2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.setrow2 .btn { min-height: 48px; }
.keeper.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
body.locked .setrow2 .btn { opacity: .45; }
.ss { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.lockb { flex: none; min-height: 40px; }
.lockb.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ss .nok { color: var(--drop); }
#ctab { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 4px); left: 50%; transform: translateX(-50%); z-index: 22; min-height: 34px; max-width: 86vw; padding: 0 16px; border-radius: 17px; border: 1px solid var(--ink); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 15px; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ctab[hidden], #ctlov[hidden] { display: none; }
#ctlov { position: fixed; inset: 0; z-index: 25; }
#ctlov .scrim2 { position: absolute; inset: 0; background: rgba(0, 0, 0, .55); }
#ctlov .ovp { position: relative; margin: 0 auto; max-width: 640px; max-height: 88vh; overflow-y: auto; background: var(--bg); border-bottom: 2px solid var(--ink); padding: calc(env(safe-area-inset-top, 0px) + 44px) 12px 12px; }
.trk { grid-template-columns: 58px minmax(0, 1fr); }
.trk .lbody { display: block; padding: 10px 12px 10px 4px; text-align: left; }
.bd { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-weight: 700; font-size: 14px; letter-spacing: .05em; }
.b-ok { color: var(--ok); } .b-chg { color: var(--chg); } .b-drop { color: var(--drop); } .b-star { color: var(--accent); }

.row.off { opacity: .42; background: var(--surface); border-left-color: var(--line); pointer-events: none; }
.row.off .txt { color: var(--muted); }
.fcount { font-weight: 700; font-size: 16px; padding: 4px 0 6px; letter-spacing: .04em; } .fcount.done { color: var(--ok); }
.seg2 { display: flex; gap: 6px; margin: 8px 0; } .seg2 button { flex: 1; min-height: 46px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); color: var(--ink); font: inherit; font-weight: 600; }
.seg2 button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.fpick { max-height: 34dvh; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
.fp { display: block; width: 100%; text-align: left; font: inherit; font-size: 16px; line-height: 1.35; color: var(--ink); background: var(--surface); border: 0; border-bottom: 1px solid var(--line); border-left: 6px solid transparent; padding: 10px 10px; min-height: 48px; }
.trl .fp { padding-right: var(--g, 10px); } .fp.act { color: var(--muted); } .fp.on { background: var(--raised); border-left-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); } .fp.anc { outline: 3px solid var(--accent); outline-offset: -3px; }
.trl { position: relative; } .trl .lbody { padding-right: var(--g, 12px) !important; }
.gut { position: absolute; right: 2px; top: 0; bottom: 0; display: flex; flex-direction: row-reverse; pointer-events: none; z-index: 2; } .gc { position: relative; width: 14px; }
.gc .ln { position: absolute; left: 5px; top: 0; bottom: -8px; width: 0; border-left: 4px solid var(--accent); } .gc .ln.top { top: 16px; }
.gc .ln.dash { border-left-style: dashed; } .gc .ln.dot { border-left: 3px dotted var(--accent); }
.gc .sn { position: absolute; top: 0; left: 0; width: 14px; text-align: center; text-decoration: none; font-size: 12px; font-weight: 800; color: var(--accent); }
.kflag { display: inline-block; margin: 6px 6px 0 0; padding: 3px 9px; border-radius: 4px; border: 2px solid var(--accent); color: var(--accent); font-weight: 800; font-size: 13px; letter-spacing: .05em; }
.kflag.yes { background: var(--accent); color: var(--accent-ink); }
.plist { display: grid; gap: 8px; margin: 8px 0; }
.pl { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; min-height: 56px; padding: 8px 14px; font: inherit; font-size: 17px; color: var(--ink); background: var(--raised); border: 1px solid var(--line); border-radius: 8px; }
.pl b { text-transform: uppercase; letter-spacing: .04em; } .pl span { color: var(--muted); font-size: 14px; white-space: nowrap; } .pl.used { opacity: .55; }
.plr { display: flex; gap: 6px; } .plr .pl { flex: 1; min-width: 0; } .mv { flex: none; width: 52px; min-height: 56px; font: inherit; font-size: 18px; color: var(--ink); background: var(--raised); border: 1px solid var(--line); border-radius: 8px; } .mv:disabled { opacity: .25; }
.misfire { width: 100%; margin-top: 8px; min-height: 48px; }
.qrow { display: flex; gap: 6px; margin-bottom: 8px; }
.qrow input { flex: 1; min-width: 0; }
.qrow button { min-width: 44px; padding: 0 8px; }
.flagsum { width: 100%; text-align: left; margin-bottom: 12px; }
.fl { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-bottom: 8px; }
.fl img, .fl .noimg { width: 72px; height: 72px; object-fit: cover; border-radius: 4px; background: var(--raised); }
.fl .k { font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 18px; }
.fl .tc { font-family: var(--script); font-size: 18px; } .fl .need { color: var(--chg); font-weight: 600; }
.fl .when { color: var(--muted); font-variant-numeric: tabular-nums; }
.fphoto { width: 100%; max-height: 42dvh; object-fit: contain; background: #000; border-radius: 6px; }
.fphoto.big { max-height: none; }
.tcin { font-family: var(--script); font-size: 30px; letter-spacing: .08em; text-align: center; width: 100%; min-height: 56px; border: 2px solid var(--line); border-radius: 6px; background: var(--raised); color: var(--ink); }
.tcin.bad { border-color: var(--drop); }
#cam { position: fixed; inset: 0; z-index: 60; background: #000; display: flex; flex-direction: column; color: #fff; }
#cam video { flex: 1 1 auto; min-height: 0; width: 100%; object-fit: cover; background: #000; }
#cam .cbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: #000; }
#cam .shutter { width: 76px; height: 76px; border-radius: 50%; border: 5px solid #fff; background: #d4423a; }
#cam .ctitle { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 0; right: 0; text-align: center; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-shadow: 0 1px 4px #000; }
#cam .cmsg { position: absolute; left: 16px; right: 16px; top: 38%; text-align: center; }
/* High contrast (default on): pure black, white text, heavy borders, for dark sets */
:root.hc { --bg: #000; --surface: #000; --raised: #14181d; --ink: #fff; --muted: #e3e8ed; --line: #8995a1;
  --accent: #b4c8ff; --accent-ink: #000; --ok: #62ff9d; --ok-bg: #04351a; --chg: #ffd84d; --chg-bg: #4a3600; --drop: #ff9488; --drop-bg: #52100a; --hl: #1b2f66; color-scheme: dark; }
.hc .row { border-width: 2px; border-left-width: 12px; }
.hc .row.st-ok { border-color: var(--ok); } .hc .row.st-chg { border-color: var(--chg); } .hc .row.st-todo, .hc .row.st-drop { border-color: var(--drop); }
.hc .row.act .txt { color: var(--ink); }
.hc .btn, .hc .card { border-width: 2px; border-color: var(--muted); }
.hc .btn.primary { border-color: var(--accent); } .hc .btn.danger { border-color: var(--drop); }
.hc .chip { border-width: 2px; }
.hc ::placeholder { color: #c3cbd3; opacity: 1; }
.hc body.locked .newtake, .hc body.locked .mark, .hc body.locked .star, .hc body.locked [data-act="fill"], .hc body.locked [data-act="clear"], .hc body.locked [data-act="takesheet"] { opacity: .6; }
body.locked .newtake, body.locked .mark, body.locked .star, body.locked [data-act="fill"], body.locked [data-act="clear"], body.locked [data-act="takesheet"] { opacity: .45; }
.wrap { max-width: 640px; margin: 0 auto; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { min-height: 48px; padding: 0 16px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 17px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { border-color: var(--drop); color: var(--drop); }
.btn.armed { background: var(--drop); color: var(--surface); border-color: var(--drop); }
.btn.small { min-height: 40px; font-size: 16px; padding: 0 12px; }
.btn:active { transform: translateY(1px); }

.banner { background: var(--chg-bg); color: var(--ink); border: 1px solid var(--chg); border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; font-size: 16px; }
.banner[hidden] { display: none; }

/* sticky take bar */
.top { position: relative; background: var(--bg); padding: 4px 0 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.scenebtn { width: 100%; min-width: 0; min-height: 48px; display: flex; align-items: center; gap: 10px; text-align: left; padding: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.scenebtn .sn { background: var(--ink); color: var(--bg); font-weight: 700; padding: 2px 8px; border-radius: 3px; letter-spacing: .08em; font-size: 16px; flex: none; }
.scenebtn .st { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.takebar { min-width: 0; display: flex; gap: 8px; align-items: stretch; }
.takebar .navb { width: 46px; flex: none; min-height: 60px; font-size: 30px; line-height: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.takebar .navb[disabled] { opacity: .35; }
.tk { flex: 1; min-width: 0; min-height: 60px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; display: grid; align-content: center; }
.tk .lab { font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tk .lab b { color: var(--ink); }
.tk .num { font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: .04em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.tk .num em { font-style: normal; font-size: 16px; letter-spacing: .08em; margin-left: 8px; padding: 2px 6px; border-radius: 3px; vertical-align: 4px; }
.tk .num em.circle { background: var(--accent); color: var(--accent-ink); }
.tk .num em.ng { background: var(--drop); color: var(--surface); }
.newtake { width: 84px; flex: none; padding: 0 6px; font-size: 18px; line-height: 1.05; }

.sum { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; display: grid; gap: 8px; }
.meter { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--drop-bg); border: 1px solid var(--drop); }
.counts .togo { color: var(--drop); }
.meter i { display: block; height: 100%; }
.meter .m-ok { background: var(--ok); } .meter .m-chg { background: var(--chg); } .meter .m-drop { background: var(--drop); }
.counts { font-size: 17px; letter-spacing: .03em; color: var(--muted); font-variant-numeric: tabular-nums; }
.counts b { color: var(--ink); font-weight: 700; }
.qa { display: flex; gap: 8px; flex-wrap: wrap; }
.notice { font-size: 16px; color: var(--muted); margin: 0 0 8px; }

/* line rows */
.row { display: grid; grid-template-columns: 58px minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--line); border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
.row.st-ok { border-left-color: var(--ok); background: var(--ok-bg); }
.row.st-chg { border-left-color: var(--chg); background: var(--chg-bg); }
.row.st-todo { border-left-color: var(--drop); background: var(--drop-bg); }
.row.st-drop { border-left-color: var(--drop); background: color-mix(in srgb, var(--drop) 24%, var(--surface)); }
.row { scroll-margin-top: 170px; }
.row.dlg { grid-template-columns: 58px minmax(0, 1fr) 54px; }
.star { border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; min-height: 66px; }
.star svg { width: 30px; height: 30px; display: block; }
.star[aria-pressed="true"] { color: var(--accent); }
.chip.star { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chip .sm { font-size: 15px; color: var(--accent); }
.counts .best, .card .cts .best { color: var(--accent); }
.row.flash { outline: 3px solid var(--accent); }
.mark { border: 0; background: transparent; min-height: 66px; display: grid; place-items: center; color: var(--muted); }
.st-ok .mark { color: var(--ok); } .st-chg .mark { color: var(--chg); } .st-drop .mark, .st-todo .mark { color: var(--drop); }
.mark svg { width: 34px; height: 34px; display: block; }
.mark .lbl { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin-top: -6px; font-weight: 600; }
.lbody { padding: 9px 12px 9px 4px; text-align: left; border: 0; background: transparent; min-width: 0; }
.cue { display: block; font-weight: 700; font-size: 16px; letter-spacing: .12em; text-transform: uppercase; }
.txt { display: block; font-family: var(--script); font-size: 16px; line-height: 1.4; overflow-wrap: anywhere; }
.row.act .txt { color: var(--muted); font-style: italic; }
.nt { display: block; margin-top: 6px; font-size: 16px; font-weight: 600; letter-spacing: .02em; }
.nt::before { content: "Note: "; text-transform: uppercase; letter-spacing: .08em; font-size: 14px; color: var(--muted); }

.empty { text-align: center; padding: 40px 12px; color: var(--muted); display: grid; gap: 14px; justify-items: center; }
.empty h2 { margin: 0; color: var(--ink); font-size: 26px; letter-spacing: .04em; text-transform: uppercase; }
.empty p { margin: 0; max-width: 32ch; font-size: 18px; }

/* log and script screens */
.h { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 4px 0 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); margin-bottom: 10px; }
.seg button { min-height: 46px; border: 0; background: transparent; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 17px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--ink); color: var(--bg); }
.card { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
.card .th { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card .tn { font-size: 24px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.card .tm { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { font-size: 15px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 1px 7px; border-radius: 3px; }
.pill.circle { background: var(--accent); color: var(--accent-ink); }
.pill.ng { background: var(--drop); color: var(--surface); }
.pill.ex { background: var(--raised); color: var(--muted); border: 1px solid var(--line); }
.card .cts { color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.card .cts b { color: var(--ink); }
.card .tnote { margin-top: 6px; font-family: var(--script); font-size: 15px; }
.lrow { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
.lrow .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

.big3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

        var fn = $('#fname', p); fn.value = proj.name || 'Project';
        async function go() {
          var name = fn.value.replace(/[\\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim() || (proj.name || 'Project');
          if (!/\.json$/i.test(name)) name += '.json';
          var pn = name.replace(/\.json$/i, ''); if (pn && pn !== proj.name) { proj.name = pn; saveIndex(); }
          var ok = false;
          if (canPick) {
            try {
              var h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'Lined Script project', accept: { 'application/json': ['.json'] } }] });
              var w = await h.createWritable(); await w.write(await projectJson(true)); await w.close(); ok = true; name = h.name || name;
            } catch (e) { if (e && e.name === 'AbortError') return; ok = await deliver(await projectJson(true), name, 'application/json'); }
          } else ok = await deliver(await projectJson(true), name, 'application/json');
          if (ok) { S.lastBackup = new Date().toISOString(); persistLocal(); closeSheet(); toast('Saved ' + name); }
        }
        $('#fsave', p).addEventListener('click', go);
        fn.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
        setTimeout(function () { try { fn.focus(); fn.select(); } catch (e) {} }, 100);
      });
  }
  function restoreSheet(d, fname) {
    var ns = d.scenes.length, nt = (d.takes || []).length, nfl = (d.flags || []).length, empty = !sceneList().length && !Object.keys(S.takes).length;
    openSheet('<h3>Open project</h3><p class="imp-info">The file holds ' + ns + ' scene' + (ns === 1 ? '' : 's') + ' and ' + nt + ' take' + (nt === 1 ? '' : 's') + (nfl ? ' and ' + nfl + ' sync flag' + (nfl === 1 ? '' : 's') : '') + '.</p>' + ((d.plans || []).length ? '<p class="imp-info">' + (d.plans || []).length + ' saved setup' + ((d.plans || []).length === 1 ? '' : 's') + ' in ' + d.scenes.filter(function (sc) { return (d.plans || []).some(function (q) { return q.sceneId === sc.id; }); }).map(function (sc) { return 'Scene ' + esc(sc.number || ''); }).join(', ') + '.</p>' : '') +
      '<p class="imp-info">' + (empty ? 'It will fill the empty project you have open.' : '<b>It is added as a new project. Your other projects are not touched.</b>') + '</p>' +
      '<div><label for="rname">Project name</label><input type="text" id="rname" autocomplete="off" maxlength="40"></div>' +
      '<button type="button" class="btn primary" id="rgo">' + (empty ? 'Open' : 'Open as new project') + '</button><button type="button" class="btn" data-act="closesheet">Cancel</button>',
      function (p) {
        var rn = $('#rname', p); rn.value = (fname ? fname.replace(/\.json$/i, '').replace(/\s*\(\d+\)$/, '') : '') || d.name || 'Opened project';
        $('#rgo', p).addEventListener('click', async function () {
          await applyProject(d, rn.value); closeSheet(); toast(S.locked ? 'Opened. Locked, read only.' : 'Opened');
        });
      });
  }

  /* ---------- projects ---------- */
  function projStats(id) {
    var d = id === PROJ.current ? S : normaliseS(readProject(id));
    return { sc: Object.keys(d.scenes).length, tk: Object.keys(d.takes).length, lk: d.locked };
  }
  function nameSheet(title, initial, btn, done) {
    openSheet('<h3>' + esc(title) + '</h3><div><label for="pname">Project name</label><input type="text" id="pname" autocomplete="off" maxlength="40" placeholder="e.g. The Other Shoot"></div>' +
      '<button type="button" class="btn primary" id="pgo">' + esc(btn) + '</button><button type="button" class="btn" data-act="closesheet">Cancel</button>',
      function (p) {
        var inp = $('#pname', p); inp.value = initial || '';
        function go() { var v = inp.value.trim(); if (!v) { toast('Give it a name.'); return; } closeSheet(); done(v); }
        $('#pgo', p).addEventListener('click', go); inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
        setTimeout(function () { try { inp.focus(); inp.select(); } catch (e) {} }, 150);
      });
  }
  function projectsSheet() {
    var list = PROJ.list.slice().sort(function (a, b) { return (b.updated || 0) - (a.updated || 0); }), ro = !!S.locked;
    openSheet('<h3>Projects</h3>' + list.map(function (x) {
      var st = projStats(x.id), d = new Date(x.updated || x.created || Date.now());
      return '<button type="button" class="pj' + (x.id === PROJ.current ? ' cur' : '') + '" data-proj="' + esc(x.id) + '"><div class="pn">' + esc(x.name) + (x.id === PROJ.current ? ' · open' : '') + '</div>' +
        '<div class="pm">' + st.sc + ' scene' + (st.sc === 1 ? '' : 's') + ' · ' + st.tk + ' take' + (st.tk === 1 ? '' : 's') + (st.lk ? ' · locked' : '') + ' · last used ' + esc(d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })) + '</div></button>';
    }).join('') +
      '<button type="button" class="btn primary" id="pnew">+ New project</button>' +
      '<button type="button" class="btn" id="psave">Save this project to a file</button>' +
      '<button type="button" class="btn" id="pren">Rename this project</button>' +
      '<button type="button" class="btn danger" id="pdel">Delete this project</button>' +
      '<button type="button" class="btn" data-act="closesheet">Close</button>',
      function (p) {
        p.querySelectorAll('[data-proj]').forEach(function (b) {
          b.addEventListener('click', function () { var id = b.getAttribute('data-proj'); if (id === PROJ.current) { closeSheet(); return; } closeSheet(); switchProject(id); toast('Opened ' + (PROJ.list.filter(function (x) { return x.id === id; })[0] || {}).name); });
        });
        $('#pnew', p).addEventListener('click', function () { nameSheet('New project', '', 'Create project', function (v) { startNewProject(v); toast('New project created'); }); });
        $('#psave', p).addEventListener('click', function () { closeSheet(); ACT.backup(); });
        $('#pren', p).addEventListener('click', function () {
          if (ro) { toast('Locked. Unlock to rename.'); return; }
          nameSheet('Rename project', (curProj() || {}).name, 'Save name', function (v) { curProj().name = v; saveIndex(); render(); toast('Renamed'); });
        });
        $('#pdel', p).addEventListener('click', function () {
          if (ro) { toast('Locked. Unlock to delete.'); return; }
          guard('Delete this project?', 'You are about to delete the project "' + ((curProj() || {}).name || '') + '". Are you sure?', 'Its script, takes, notes and sync flags will be erased. Your other projects are not touched.', function () { deleteCurrentProject(); toast('Project deleted'); });
        });
      });
  }

  /* ---------- lock ---------- */
  var TAKELOCK = { keeper: 1, misfire: 1, takesheet: 1, cycle: 1, open: 1, star: 1, fill: 1, clear: 1 };
  var BLOCKED = { keeper: 1, newsetup: 1, misfire: 1, flagstart: 1, flagsync: 1, flagstop: 1, import: 1, addscene: 1, clearall: 1, newtake: 1, takesheet: 1, cycle: 1, star: 1, fill: 1, clear: 1, editscene: 1 };
  /* Delete code. Not secret, just a few deliberate steps. It can only be changed here in the file (by Claude), never inside the app. */
  var DELETE_CODE = '1234';
  function deleteAll() {
    Object.keys(S.takes).forEach(function (id) { remove('takes', id); });
    sceneList().forEach(function (s) { remove('scenes', s.id); });
    Object.keys(S.flags).forEach(function (id) { photoDel(id); remove('flags', id); });
    UI.sceneId = null; UI.takeId = null; render(); toast('Script and takes cleared');
  }
  /* Every destructive action goes through guard(): Yes/No, then the code. */
  function guard(heading, lead, detail, action) {
    openSheet('<h3>' + esc(heading) + '</h3><p class="imp-info"><b>' + esc(lead) + '</b><br>' + esc(detail) + '</p>' +
      '<button type="button" class="btn danger" id="dyes">Yes</button><button type="button" class="btn primary" data-act="closesheet">No</button>',
      function (p) { $('#dyes', p).addEventListener('click', function () { guardCode(action); }); });
  }
  function guardCode(action) {
    openSheet('<h3>Type ' + DELETE_CODE + '</h3><p class="imp-info">Type the number below to carry on. This cannot be undone.</p>' +
      '<input class="tcin" id="dcode" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="8" placeholder="' + DELETE_CODE + '"><p class="notice" id="dmsg"></p>' +
      '<button type="button" class="btn danger" id="ddone">Done</button><button type="button" class="btn primary" data-act="closesheet">Cancel</button>',
      function (p) {
        var inp = $('#dcode', p), msg = $('#dmsg', p);
        inp.addEventListener('input', function () { inp.value = inp.value.replace(/\D/g, ''); inp.classList.remove('bad'); msg.textContent = ''; });
        $('#ddone', p).addEventListener('click', function () {
          if (inp.value !== DELETE_CODE) { inp.classList.add('bad'); msg.textContent = 'That is not the number. Nothing was changed.'; inp.value = ''; return; }
          closeSheet(); action();
        });
        setTimeout(function () { try { inp.focus(); } catch (e) {} }, 150);
      });
  }
  function deleteSheet() { guard('Delete the script?', 'You are about to delete the script. Are you sure?', 'All scenes, takes, notes and sync flags on this device will be erased.', deleteAll); }
  function unlockSheet() {
    openSheet('<h3>Unlock the script?</h3><p class="imp-info">While unlocked, takes, marks and notes can be changed or erased.</p>' +
      '<button type="button" class="btn primary" id="uyes">Yes, unlock</button><button type="button" class="btn" data-act="closesheet">No</button>',
      function (p) { $('#uyes', p).addEventListener('click', function () { S.locked = false; persistLocal(); closeSheet(); toast('Unlocked'); }); });
  }

  /* ---------- clicks ---------- */
  var ACT = {
    unlock: function () { unlockSheet(); },
    projects: function () { projectsSheet(); },
    wrap: function () { if (S.locked) { toast('Locked.'); return; } wrapSheet(); },
    resume: function () {
      if (S.locked) { toast('Locked. Unlock first.'); return; }
      S.resumes = S.resumes || []; S.resumes.push(Date.now()); S.wrapped = false; persistLocal(); render(); toast('Resumed · new session ' + (S.resumes.length + 1));
      openCamera('start');
    },
    quick: function () { quickSheet(); },
    locksetup: function (el) {
      var k = el.getAttribute('data-k') || '', n = k.split('|')[1] || '', on = (S.lockedSetups || []).indexOf(k) >= 0;
      guard(on ? 'Unlock this setup?' : 'Lock this setup?', 'You are about to ' + (on ? 'unlock' : 'lock') + ' Setup ' + n + '. Are you sure?',
        on ? 'Its takes, keepers, marks and notes can be changed again.' : 'Its takes, keepers, marks and notes cannot be changed until you unlock it.',
        function () {
          S.lockedSetups = S.lockedSetups || [];
          if (on) S.lockedSetups = S.lockedSetups.filter(function (x) { return x !== k; }); else if (S.lockedSetups.indexOf(k) < 0) S.lockedSetups.push(k);
          persistLocal(); closeSheet(); toast('Setup ' + n + (on ? ' unlocked' : ' locked'));
        });
    },
    saveplan: function () { if (curScene()) setupSheet({ mode: 'save' }); },
    autosaves: function () { snapSheet(); },
    keeper: function () { var t = curTake(); if (t && t.result !== 'circle' && !keeperOk(t)) return; keeperSheet(); },
    newsetup: function () {
      var last = allTakesSorted().pop();
      if (last && !S.wrapped && new Date(last.createdAt).toDateString() === new Date().toDateString() && !Object.keys(S.takes).some(function (k) { var x = S.takes[k]; return x.sceneId === last.sceneId && x.setup === last.setup && x.result === 'circle'; })) {
        openSheet('<h3>No keeper yet</h3><p class="imp-info"><b>You don’t have a KEEPER yet. Are you sure?</b></p><button type="button" class="btn primary" data-act="closesheet">No, keep going</button><button type="button" class="btn" id="kyes">Yes, new setup</button>',
          function (p) { $('#kyes', p).addEventListener('click', function () { closeSheet(); pickSheet(); }); });
        return;
      }
      pickSheet();
    },
    misfire: function () { var t = curTake(); if (!t || wrapGuard()) return; var sc = curScene(), last = allTakesSorted().filter(function (x) { return sc && x.sceneId === sc.id; }).pop(); if (last && last.id !== t.id) { toast('You are looking at an earlier take. Go to the latest take first.'); return; } t.result = 'misfire'; save('takes', t); newTake(); },
    flagstart: function () { openCamera('start'); },
    flagsync: function () { openCamera('sync'); },
    flagstop: function () { openCamera('stop'); },
    flags: function () { flagsSheet(); },
    openflag: function (el) { flagSheet(el.getAttribute('data-id')); },
    contrast: function () { HC = !HC; try { localStorage.setItem('linedscript.hc', HC ? '1' : '0'); } catch (e) {} render(); toast('High contrast ' + (HC ? 'on' : 'off')); },
    update: async function () {
      if (!navigator.onLine) { toast('No internet. Try again with signal.'); return; }
      toast('Checking for updates…');
      try {
        var txt = await (await fetch('index.html?nocache=' + Date.now(), { cache: 'no-store' })).text();
        var m = txt.match(/var APP_VER = (\d+);/), live = m ? Number(m[1]) : APP_VER;
        if (live === APP_VER) { toast('You have the latest version (Ver ' + APP_VER + ').'); return; }
        toast('Updating to Ver ' + live + '…');
        try { var reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch (e) {}
        var keys = await caches.keys();
        await Promise.all(keys.filter(function (k) { return k.indexOf('fonts') < 0; }).map(function (k) { return caches.delete(k); }));
        setTimeout(function () { location.reload(); }, 600);
      } catch (e) { toast('Could not check. Try again with signal.'); }
    },
    tab: function (el) { UI.tab = el.getAttribute('data-tab'); render(); window.scrollTo(0, 0); },
    scenes: function () { sceneSheet(); },
    import: function () { importSheet('replace'); },
    addscene: function () { importSheet('add'); },
    backup: function () { saveSheet(); },
    sharescript: async function () { deliver(await projectJson(false), 'script-only-' + slug((curProj() || {}).name) + '-' + stamp() + '.json', 'application/json'); },
    restore: function () { var f = $('#restorefile'); f.value = ''; f.click(); },
    clearall: function () { deleteSheet(); },
    closesheet: function () { closeSheet(); },
    newtake: function () { newTake(); },
    takesheet: function () { takeSheet(); },
    prevtake: function () { moveTake(-1); },
    nexttake: function () { moveTake(1); },
    cycle: function (el) { var t = curTake(); if (!t) return; var id = el.closest('.row').getAttribute('data-id'); var was = t.result; setMark(t, id, NEXT[(t.marks || {})[id] || '']); if (was !== t.result) render(); else repaintRow(id); },
    open: function (el) { lineSheet(el.closest('.row').getAttribute('data-id')); },
    star: function (el) { var t = curTake(); if (!t) return; var id = el.closest('.row').getAttribute('data-id'); toggleStar(t, id); repaintRow(id); },
    fill: function () { var sc = curScene(), t = curTake(); if (!t) return; var n = 0; vis(sc).forEach(function (l) { if ((l.type === 'dialogue' || focusOf(t)) && inFocus(t, l.id) && !(t.marks || {})[l.id]) { t.marks = t.marks || {}; t.marks[l.id] = 'ok'; n++; } }); save('takes', t); render(); toast(n + ' line' + (n === 1 ? '' : 's') + ' marked as said'); },
    clear: function () { var t = curTake(); if (!t) return; guard('Clear this take?', 'You are about to clear every mark, note and star in this take. Are you sure?', 'The take itself stays.', function () { t.marks = {}; t.notes = {}; t.stars = {}; if (t.result === 'circle' && focusOf(t)) t.result = ''; save('takes', t); render(); toast('Take cleared'); }); },
    filter: function () { UI.dialogueOnly = !UI.dialogueOnly; render(); },
    logview: function (el) { UI.logView = el.getAttribute('data-v'); render(); },
    gotake: function (el) {
      UI.takeId = el.getAttribute('data-id'); UI.tab = 'take'; render();
      var ln = el.getAttribute('data-line');
      if (ln) { var r = document.querySelector('.row[data-id="' + ln + '"]'); if (r) { r.scrollIntoView({ block: 'center' }); r.classList.add('flash'); setTimeout(function () { r.classList.remove('flash'); }, 1600); } } else window.scrollTo(0, 0);
    },
    openscene: function (el) { UI.sceneId = el.getAttribute('data-id'); UI.takeId = null; UI.tab = 'take'; render(); window.scrollTo(0, 0); },
    editscene: function (el) { sceneEditSheet(el.getAttribute('data-id')); },
    copyreport: function () { var sc = curScene(); if (sc) copyText(reportText(sc), 'Report'); },
    csvscene: function () { var sc = curScene(); if (sc) { saveCsv([sc], 'scene-' + (sc.number || 'x') + '-takes.csv'); warnUntyped(); } },
    resolvemarkers: async function () {
      var r = markersEdl(sceneList());
      if (!r.n) { toast('No takes have a timecode yet. Add sync flags and type their timecode.'); return; }
      await deliver(r.text, 'resolve-markers-' + slug((curProj() || {}).name) + '-' + stamp() + '.edl', 'text/plain');
      if (r.skipped) toast(r.skipped + ' take' + (r.skipped === 1 ? ' has' : 's have') + ' no timecode, left out');
    },
    resolvecsv: async function () {
      var r = resolveCsv(sceneList());
      if (!r.n) { toast('No takes logged yet.'); return; }
      await deliver(r.text, 'resolve-metadata-' + slug((curProj() || {}).name) + '-' + stamp() + '.csv', 'text/csv'); warnUntyped();
      if (r.missing) toast(r.missing + ' take' + (r.missing === 1 ? ' has' : 's have') + ' no timecode and no clip name, so Resolve cannot match ' + (r.missing === 1 ? 'it' : 'them') + '.');
    },
    csvall: function () { saveCsv(sceneList(), 'lined-script-all-takes.csv'); warnUntyped(); }
  };
  function moveTake(d) {
    var sc = curScene(), t = curTake(); if (!sc || !t) return;
    var ts = takesOf(sc.id), i = ts.indexOf(t) + d; if (i < 0 || i >= ts.length) return;
    UI.takeId = ts[i].id; render(); window.scrollTo(0, 0);
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var name = el.getAttribute('data-act');
    if (S.locked && BLOCKED[name]) { toast('Locked. Tap Unlock to make changes.'); return; }
    if (TAKELOCK[name] && isLockedTake(curTake())) { toast('This setup is locked. Unlock it to make changes.'); return; }
    var fn = ACT[name]; if (fn) fn(el, e);
  });

  $('#restorefile').addEventListener('change', async function (e) {
    var f = e.target.files[0]; if (!f) return;
    try {
      var d = JSON.parse(await f.text());
      if (!d || !d.linedscript || !Array.isArray(d.scenes) || !d.scenes.length) throw new Error('bad');
      restoreSheet(d, f.name);
    } catch (err) { toast('That is not a Lined Script file.'); }
  });
  render();
  init();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>

</body>
</html>
